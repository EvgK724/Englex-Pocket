name: Prepare generated Microsoft Ryan recordings

on:
  workflow_dispatch:
    inputs:
      continuation:
        description: 'Bounded continuation (0 for a new run, maximum 8)'
        required: false
        type: number
        default: 0
  push:
    branches: [main]
    paths:
      - 'dist/dictionary.json'
      - 'dist/examples.json'
      - 'scripts/generate-englex-ryan.py'
      - 'scripts/generate-example-ryan.py'
      - '.github/workflows/englex-ryan.yml'
      # Audio checkpoint pushes do not restart generation.

permissions:
  contents: read

jobs:
  prepare:
    # One queue for words and examples; current/future English text is authorized.
    # Original dictionary, original Englex MP3s and old generated MP3s stay intact.
    concurrency:
      group: englex-ryan-recordings
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reviewed client and offline decoder
        shell: bash
        run: |
          python -m pip install 'edge-tts==7.3.1'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Test preservation, examples and speech validation without service calls
        run: |
          python scripts/test-englex-ryan.py
          python scripts/test-example-ryan.py
          node --test scripts/test-examples.mjs scripts/test-example-ui.mjs
      - name: Generate missing word recordings and publish checkpoints
        id: words
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTINUATION_COUNT: ${{ inputs.continuation || 0 }}
        run: >-
          python scripts/generate-englex-ryan.py --approved-dictionary-egress
          --publish --deadline-minutes 50 --continuation "$CONTINUATION_COUNT"
      - name: Generate missing example recordings and publish checkpoints
        id: examples
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTINUATION_COUNT: ${{ inputs.continuation || 0 }}
        run: >-
          python scripts/generate-example-ryan.py --approved-example-egress
          --publish --deadline-minutes 200 --continuation "$CONTINUATION_COUNT"
      - name: Read both statuses and bounded continuation
        id: status
        if: ${{ !cancelled() }}
        env:
          CONTINUATION_COUNT: ${{ inputs.continuation || 0 }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('ryan', 'scripts/generate-englex-ryan.py')
          ryan = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ryan)
          paths = {'Words': Path('.englex-ryan/status.json'), 'Examples': Path('.englex-examples-ryan/status.json')}
          statuses = {name: json.loads(path.read_text()) if path.is_file() else {} for name, path in paths.items()}
          complete = all(status.get('complete') is True for status in statuses.values())
          no_error = all(status and status.get('stop_reason') != 'error' for status in statuses.values())
          next_run = next((result for status in statuses.values()
                           if (result := ryan.next_continuation(status, int(os.environ['CONTINUATION_COUNT']))) is not None), None)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'deploy={str(complete).lower()}\n')
              if no_error and next_run is not None:
                  output.write(f'continuation={next_run}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name, status in statuses.items():
                  summary.write(f"{name}: {status.get('generated', 'unknown')} new Ryan recordings; "
                                f"{status.get('available', 'unknown')} available; {status.get('remaining', 'unknown')} remaining; "
                                f"complete: {status.get('complete') is True}.\n\n")
              summary.write('Pages publishes only after all current words and examples have matching Ryan audio.\n')
              if not no_error:
                  summary.write('An error or missing status stopped automatic continuation; existing live Pages stays available.\n')
          PY
      - name: Publish complete audio to Pages
        # Bot checkpoint pushes do not trigger Pages. Its own gate rechecks latest main.
        if: ${{ !cancelled() && steps.status.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
      - name: Continue only a productive run stopped at its deadline
        if: ${{ !cancelled() && steps.status.outputs.continuation != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_CONTINUATION: ${{ steps.status.outputs.continuation }}
        run: gh workflow run englex-ryan.yml --ref main -f continuation="$NEXT_CONTINUATION"
      - name: Preserve sanitized status reports and audio manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: englex-ryan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .englex-ryan/status.json
            .englex-examples-ryan/status.json
            dist/englex-ryan-index.json
            dist/englex-examples-ryan-index.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
