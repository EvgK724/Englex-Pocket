name: Import original Englex AI recordings

on:
  push:
    branches: [main]
    paths:
      - '.englex-audio-import/batch.json'

permissions:
  contents: read

concurrency:
  # Do not let a newer bundle replace a different queued batch. Publication
  # merges independent events on current main with guarded non-forced pushes.
  group: englex-original-ai-import-${{ github.sha }}
  cancel-in-progress: false

jobs:
  import:
    if: startsWith(github.event.head_commit.message, 'Import original Englex AI recordings [englex-ai-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline importer and concurrent publication
        run: node --test tests/import-englex-audio.test.mjs tests/publish-englex-audio-bundle.test.mjs
      - name: Merge exact event bundle onto latest main
        id: import
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/publish-englex-audio-bundle.mjs --source-commit "$SOURCE_COMMIT"
      - name: Publish original recordings to Pages
        if: steps.import.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
