name: Prepare Fish voice library

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Chonishvili variant A or a preserved legacy profile'
        required: true
        default: a
        type: choice
        options:
          - a
          - english
          - accepted
      mode:
        description: 'Trial pronunciation samples or the finite current dictionary'
        required: true
        default: full
        type: choice
        options:
          - trial
          - full
      continuation:
        description: 'Bounded A continuation number (0 for a new run, maximum 8)'
        required: false
        type: number
        default: 0
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fish-voice-recordings
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select requested profiles and detect dictionary additions
        id: plan
        run: node scripts/fish-library-plan.mjs
  prepare:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          # A queued run must include newer imports and previous checkpoints.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the accepted audio processing tools are available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test finite generation and safe publication without API calls
        run: node --test tests/fish-library.test.mjs
      - name: Prepare recordings and publish resumable checkpoints
        id: generate
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FISH_MODE: ${{ matrix.mode }}
          FISH_VOICE: ${{ matrix.voice }}
        shell: bash
        run: |
          case "$FISH_MODE" in
            trial|full) ;;
            *) echo 'Unsupported generation mode.' >&2; exit 1 ;;
          esac
          case "$FISH_VOICE" in
            accepted|english|a) ;;
            *) echo 'Unsupported voice profile.' >&2; exit 1 ;;
          esac
          node scripts/generate-fish-library.mjs --mode "$FISH_MODE" --voice "$FISH_VOICE" --publish --deadline-minutes 250
      - name: Read checkpoint publication status
        id: publication
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const statusPath = '.fish-library/status.json';
          if (!fs.existsSync(statusPath)) process.exit(0);
          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          const published = Number.isInteger(status.publishedCommits) && status.publishedCommits > 0;
          const deploy = published || (Number.isInteger(status.available) && status.available > 0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${deploy}\n`);
          const count = (value) => Number.isInteger(value) && value >= 0 ? value : 'unknown';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Fish voice: ${count(status.generated)} generated; ${count(status.available)} available; ` +
            `${count(status.remaining)} remaining.\n\n` +
            `Published checkpoints: ${count(status.publishedCommits)}. Complete: ${status.complete === true}.\n`);
          NODE
      - name: Publish the latest successful checkpoint to Pages
        # GITHUB_TOKEN pushes do not trigger the separate Pages push workflow.
        # Deploy partial progress and let a no-op rerun recover a prior Pages failure.
        if: ${{ !cancelled() && steps.publication.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
      - name: Check whether the finite A queue can continue after its deadline
        id: continuation
        if: ${{ !cancelled() }}
        env:
          CONTINUATION_COUNT: ${{ matrix.continuation }}
        run: node scripts/fish-library-plan.mjs --continuation "$CONTINUATION_COUNT"
      - name: Resume remaining A recordings on latest main
        # Only a deadline with newly published progress can dispatch another run.
        # API, quota, authentication and publication errors never auto-retry.
        if: ${{ !cancelled() && steps.continuation.outputs.next != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_CONTINUATION: ${{ steps.continuation.outputs.next }}
        run: gh workflow run fish-library.yml --ref main -f voice=a -f mode=full -f continuation="$NEXT_CONTINUATION"
      - name: Preserve original and processed recordings for review
        if: ${{ !cancelled() && steps.generate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: fish-chonishvili-library-${{ matrix.voice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .fish-library/raw/**/*.mp3
            .fish-library/queue.json
            .fish-library/status.json
            dist/audio/fish-chonishvili/*.mp3
            dist/fish-chonishvili-index.json
            dist/audio/fish-chonishvili-en-gb-v1/*.mp3
            dist/fish-chonishvili-en-gb-v1-index.json
            dist/audio/fish-chonishvili-a-v1/*.mp3
            dist/fish-chonishvili-a-v1-index.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
