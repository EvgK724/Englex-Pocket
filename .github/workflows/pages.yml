name: Publish Englex Pocket

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Test dictionary imports
        run: node --test scripts/test-import-englex.mjs scripts/test-voice-options.mjs scripts/test-recorded-speech.mjs scripts/test-fish-voice.mjs tests/import-englex-audio.test.mjs

      - name: Check application
        run: node scripts/check-static.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

