name: Prepare Fish voice recordings

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum missing recordings to generate (1–50)'
        required: true
        default: '5'
        type: string
      ids:
        description: 'Optional comma-separated card IDs; blank selects recent missing cards first'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: fish-voice-recordings
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator without API calls
        run: node --test tests/fish-audio.test.mjs
      - name: Generate a bounded batch with the free engine
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_LIMIT: ${{ inputs.limit || '5' }}
          FISH_IDS: ${{ inputs.ids }}
        shell: bash
        run: |
          args=(--limit "$FISH_LIMIT")
          if [[ -n "$FISH_IDS" ]]; then args+=(--ids "$FISH_IDS"); fi
          node scripts/generate-fish-audio.mjs "${args[@]}"
      - name: Upload recordings for manual listening and review
        if: ${{ !cancelled() && hashFiles('dist/fish-chonishvili-index.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fish-chonishvili-recordings-${{ github.run_id }}
          path: |
            dist/audio/fish-chonishvili/*.mp3
            dist/fish-chonishvili-index.json
          if-no-files-found: error
          retention-days: 14
