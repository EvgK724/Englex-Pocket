name: Import soft AI Voice recordings

on:
  push:
    branches: [main]
    paths:
      - '.soft-audio-import/batch.json'

permissions:
  contents: read

concurrency:
  group: soft-ai-voice-import-${{ github.sha }}
  cancel-in-progress: false

jobs:
  import:
    if: startsWith(github.event.head_commit.message, 'Import soft AI Voice recordings [soft-ai-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline soft import and concurrent publication
        run: node --test tests/import-soft-audio.test.mjs tests/publish-soft-audio-bundle.test.mjs
      - name: Merge exact event bundle onto latest main
        id: import
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/publish-soft-audio-bundle.mjs --source-commit "$SOURCE_COMMIT"
      - name: Publish soft recordings to Pages
        if: steps.import.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
